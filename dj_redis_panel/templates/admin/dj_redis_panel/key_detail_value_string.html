{% load i18n %}
{# String value display and editing template #}

{% if allow_key_edit %}
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="action" value="update_value">
  <div class="dcr-code-viewer">
    <div class="dcr-code-viewer__header">
      <span class="dcr-code-viewer__label">&lt;&gt; {% trans "String Value" %}</span>
    </div>
    <textarea id="new_value" name="new_value" class="dcr-code-viewer__body dcr-input" rows="5" style="width:100%;resize:vertical">{{ key_data.value }}</textarea>
  </div>
  <div class="dcr-form__row">
    <button type="submit" class="dcr-btn dcr-btn--primary">{% trans "Update Value" %}</button>
  </div>
</form>
{% else %}
<div class="dcr-code-viewer">
  <div class="dcr-code-viewer__header">
    <span class="dcr-code-viewer__label">&lt;&gt; {% trans "String Value" %}</span>
  </div>
  <textarea class="dcr-code-viewer__body dcr-input" rows="5" style="width:100%" readonly disabled>{{ key_data.value }}</textarea>
</div>
<p class="dcr-text-muted dcr-text-sm">{% trans "Value editing is disabled for this instance." %}</p>
{% endif %}
