{% load i18n %}
{# RedisJSON value display template (read-only) #}

<div class="dcr-code-viewer">
  <div class="dcr-code-viewer__header">
    <span class="dcr-code-viewer__label">&lt;&gt; {% trans "JSON Value" %}</span>
  </div>
  <pre>{{ key_data.value }}</pre>
</div>
<p class="dcr-text-muted dcr-text-sm">{% trans "Value editing is not supported for RedisJSON keys." %}</p>
